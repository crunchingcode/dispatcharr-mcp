[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dispatcharr-mcp"
version = "2.7.0"
description = "MCP server for Dispatcharr IPTV stream management"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["mcp", "dispatcharr", "iptv", "streaming"]
dependencies = [
    # Upper bound is load-bearing, not caution: mcp 2.0 deleted the whole 1.x
    # `mcp.server.fastmcp` package without a deprecation period, so assume 3.0
    # may break imports the same way. Port first, then raise the bound.
    "mcp[cli]>=2.2,<3",
    "httpx>=0.27.0",
]

[project.scripts]
dispatcharr-mcp = "dispatcharr_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["dispatcharr_mcp"]
