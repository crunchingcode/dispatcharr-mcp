[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dispatcharr-mcp"
version = "2.6.0"
description = "MCP server for Dispatcharr IPTV stream management"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["mcp", "dispatcharr", "iptv", "streaming"]
dependencies = [
    # Upper bound is load-bearing, not caution. mcp 2.0 (2026-07-28) deleted the
    # `mcp.server.fastmcp` package outright — FastMCP became MCPServer under
    # `mcp.server.mcpserver`, with a different API. server.py imports the 1.x
    # path, so an unbounded spec means the next image build resolves to 2.x and
    # the container dies on import. Removing this pin requires porting to the
    # 2.x MCPServer API first.
    "mcp[cli]>=1.0.0,<2",
    "httpx>=0.27.0",
]

[project.scripts]
dispatcharr-mcp = "dispatcharr_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["dispatcharr_mcp"]
