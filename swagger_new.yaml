  /api/epg/programs/search/:
    get:
      operationId: api_epg_programs_search_list
      description: "\n**Advanced EPG program search with multiple filter types and
        complex query support.**\n\n### Text Search Features\n\n**Title and Description
        Search**:\n- Supports AND/OR logical operators (case-insensitive: `and`/`AND`
        both work)\n- Wrap phrases in double quotes to match them literally: `\"Law
        and Order\"`\n- Parenthetical grouping for complex queries: `(Newcastle OR
        NEW) AND (Villa OR AST)`\n- Regex pattern matching with `title_regex=true`
        (evaluated by the database engine)\n- Whole word matching with `title_whole_words=true`
        to avoid partial matches\n\n**Examples**:\n- Simple: `title=football`\n- AND
        operator: `title=premier AND league`\n- OR operator: `title=Newcastle OR Villa`\n-
        Quoted phrase: `title=\"Law and Order\"` (matches the exact phrase; 'and'
        is literal)\n- Mixed: `title=\"Law and Order\" AND crime`\n- Nested groups:
        `title=(Newcastle OR NEW) AND (Villa OR AST)`\n- Regex: `title=^Premier&title_regex=true`
        (programs starting with \"Premier\")\n- Whole words: `title=NEW&title_whole_words=true`
        (matches \"NEW\" but not \"News\")\n\n### Time Filtering\n\n**airing_at**:
        Find programs airing at a specific moment (start_time ≤ airing_at < end_time)\n\n**Time
        ranges**: Use combinations of start_after, start_before, end_after, end_before\n\n###
        Response Customization\n\n**fields**: Comma-separated list to include only
        specific fields in response\n- Available: id, title, sub_title, description,
        start_time, end_time, tvg_id, custom_properties, epg_source, epg_name, epg_icon_url,
        channels, streams\n\n### Pagination\n\n- Default: 50 results per page\n- Maximum:
        500 results per page\n- Use `page` and `page_size` parameters to navigate
        results\n        "
      summary: Search EPG programs
      parameters:
      - in: query
        name: airing_at
        schema:
          type: string
          format: date-time
        description: Find programs airing at this exact moment (start_time ≤ airing_at
          < end_time). ISO 8601 format, e.g. `2026-02-14T20:00:00Z`.
      - in: query
        name: channel
        schema:
          type: string
        description: Filter by channel name (case-insensitive substring match). e.g.
          `BBC One`, `Sky Sports`.
      - in: query
        name: channel_id
        schema:
          type: integer
        description: Filter by exact channel ID.
      - in: query
        name: description
        schema:
          type: string
        description: Description search query. Same syntax and features as title search.
      - in: query
        name: description_regex
        schema:
          type: boolean
        description: 'Enable regex matching for description (case-insensitive, default:
          false).'
      - in: query
        name: description_whole_words
        schema:
          type: boolean
        description: 'Match whole words only in description (default: false). Same
          behaviour as title_whole_words.'
      - in: query
        name: end_after
        schema:
          type: string
          format: date-time
        description: Filter programs ending at or after this time. ISO 8601 format.
      - in: query
        name: end_before
        schema:
          type: string
          format: date-time
        description: Filter programs ending at or before this time. ISO 8601 format.
      - in: query
        name: epg_source
        schema:
          type: integer
        description: Filter by EPG source ID.
      - in: query
        name: fields
        schema:
          type: string
        description: Comma-separated list of fields to include. Omit to return all
          fields. e.g. `title,start_time,end_time`.
      - in: query
        name: group
        schema:
          type: string
        description: Filter by channel group or stream group name (case-insensitive
          substring match). e.g. `Sports`, `UK Channels`.
      - in: query
        name: page
        schema:
          type: integer
        description: 'Page number for pagination (default: 1).'
      - in: query
        name: page_size
        schema:
          type: integer
        description: 'Results per page (default: 50, max: 500).'
      - in: query
        name: start_after
        schema:
          type: string
          format: date-time
        description: Filter programs starting at or after this time. ISO 8601 format,
          e.g. `2026-02-14T18:00:00Z`.
      - in: query
        name: start_before
        schema:
          type: string
          format: date-time
        description: Filter programs starting at or before this time. ISO 8601 format.
      - in: query
        name: stream
        schema:
          type: string
        description: Filter by stream name (case-insensitive substring match).
      - in: query
        name: title
        schema:
          type: string
        description: 'Title search query. Supports AND/OR operators (case-insensitive),
          quoted phrases, and parentheses. Double-quote a phrase to match it literally:
          `"Law and Order"`. Unquoted space-separated terms are matched as a phrase;
          use AND/OR to combine separate terms.'
      - in: query
        name: title_regex
        schema:
          type: boolean
        description: 'Enable regex matching for title (case-insensitive, default:
          false). e.g. `^The` matches titles starting with "The".'
      - in: query
        name: title_whole_words
        schema:
          type: boolean
        description: 'Match whole words only in title (default: false). e.g. `new`
          matches "Newcastle" normally but not with whole words enabled.'
      - in: query
        name: tvg_id
        schema:
          type: string
        description: Filter by EPG tvg_id (exact match). e.g. `bbcone.uk`.
      tags:
      - EPG
      security:
      - jwtAuth: []
      - ApiKeyAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ProgramSearchResult'
          description: ''
