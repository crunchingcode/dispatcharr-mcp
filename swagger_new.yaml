  /api/channels/streams/regex-preview/:
    get:
      operationId: api_channels_streams_regex_preview_retrieve
      description: Returns regex preview info for a group's streams. Used by the auto-sync
        gear modal so users can see how their find/replace or filter pattern affects
        real stream names before saving. Caps in-memory iteration at SCAN_CAP streams
        per call so the endpoint stays bounded even on groups with tens of thousands
        of streams; the caller surfaces total_in_group and scan_limit_hit so users
        know whether the preview is complete.
      parameters:
      - in: query
        name: channel_group
        schema:
          type: string
        description: Channel group name to scope the preview to.
        required: true
      - in: query
        name: exclude
        schema:
          type: string
        description: Filter regex for the exclude preview. When supplied, the response
          includes exclude_matches and exclude_match_count.
      - in: query
        name: find
        schema:
          type: string
        description: Find regex for the rename preview. When supplied, the response
          includes find_matches and find_match_count.
      - in: query
        name: limit
        schema:
          type: integer
        description: Max preview entries per match list (default 10, capped at 50).
      - in: query
        name: match
        schema:
          type: string
        description: Filter regex for the include preview. When supplied, the response
          includes filter_matches and filter_match_count.
      - in: query
        name: replace
        schema:
          type: string
        description: Replacement string used with the find pattern. Defaults to empty
          string when omitted.
      tags:
      - api
      security:
      - jwtAuth: []
      - ApiKeyAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StreamRegexPreviewResponse'
          description: ''
