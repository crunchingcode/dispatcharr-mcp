components:
  schemas:
    AccountTypeEnum:
      enum:
      - STD
      - XC
      type: string
      description: |-
        * `STD` - Standard
        * `XC` - Xtream Codes
    AssignChannelsRequest:
      type: object
      properties:
        starting_number:
          type: number
          format: double
          description: Starting channel number to assign (can be decimal)
        channel_ids:
          type: array
          items:
            type: integer
          description: Channel IDs to assign
      required:
      - channel_ids
    AvailablePluginsResponse:
      type: object
      properties:
        plugins:
          type: array
          items:
            type: object
            additionalProperties: {}
      required:
      - plugins
    BatchSetEpgRequest:
      type: object
      properties:
        associations:
          type: array
          items:
            $ref: '#/components/schemas/EpgAssociation'
      required:
      - associations
    BulkRegexRenameRequest:
      type: object
      properties:
        channel_ids:
          type: array
          items:
            type: integer
        find:
          type: string
        replace:
          type: string
        flags:
          type: string
      required:
      - channel_ids
      - find
    BulkRemoveSeriesRecordingsRequest:
      type: object
      properties:
        tvg_id:
          type: string
          description: Channel TVG ID (required)
        title:
          type: string
          description: Series title - when scope=title, only recordings matching this
            title are removed
        scope:
          allOf:
          - $ref: '#/components/schemas/ScopeEnum'
          default: title
          description: |-
            title: remove only matching title on channel, channel: remove all future recordings on channel

            * `title` - title
            * `channel` - channel
      required:
      - tvg_id
    CatchupSessionCreate:
      type: object
      properties:
        channel_uuid:
          type: string
          format: uuid
          description: Dispatcharr channel UUID to play catch-up from.
        start:
          type: string
          description: UTC programme start time (which archived show to play). ISO-8601
            (2026-07-09T14:00:00Z), Unix epoch, or XC wall-clock shapes.
        duration:
          type: integer
          maximum: 480
          minimum: 1
          description: Optional programme length in minutes. Preferred over EPG when
            supplied. A short buffer is added for provider archive lag. Omit to derive
            the length from EPG.
      required:
      - channel_uuid
      - start
    CatchupSessionCreateError:
      type: object
      properties:
        error:
          type: string
      required:
      - error
    CatchupSessionDestroyForbidden:
      type: object
      properties:
        error:
          type: string
      required:
      - error
    CatchupSessionDestroyNotFound:
      type: object
      properties:
        error:
          type: string
      required:
      - error
    CatchupSessionForbidden:
      type: object
      properties:
        error:
          type: string
      required:
      - error
    CatchupSessionNotFound:
      type: object
      properties:
        error:
          type: string
      required:
      - error
    CatchupSessionPosition:
      type: object
      properties:
        position_secs:
          type: number
          format: double
          maximum: 28800
          minimum: 0
          description: Current playhead within the programme, in seconds from programme
            start.
        paused:
          type: boolean
          description: When true, admin stats freeze at ``position_secs`` (no wall-clock
            advance). When false, clear pause. Omit to leave pause state unchanged.
      required:
      - position_secs
    CatchupSessionPositionError:
      type: object
      properties:
        error:
          type: string
      required:
      - error
    CatchupSessionPositionForbidden:
      type: object
      properties:
        error:
          type: string
      required:
      - error
    CatchupSessionPositionNotFound:
      type: object
      properties:
        error:
          type: string
      required:
      - error
    CatchupSessionResponse:
      type: object
      properties:
        session_id:
          type: string
        playback_url:
          type: string
        expires_at:
          type: integer
          description: 'Unix timestamp. Handshake deadline: first playback GET within
            this window.'
        channel_uuid:
          type: string
          format: uuid
        start:
          type: string
        duration:
          type: integer
          nullable: true
          description: Programme length in minutes if supplied at creation, else null.
      required:
      - channel_uuid
      - expires_at
      - playback_url
      - session_id
      - start
    CategoryTypeEnum:
      enum:
      - movie
      - series
      type: string
      description: |-
        * `movie` - Movie
        * `series` - Series
    ChanneProfilelMembershipUpdate:
      type: object
      properties:
        channel_id:
          type: integer
        enabled:
          type: boolean
      required:
      - channel_id
      - enabled
    Channel:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        channel_number:
          type: number
          format: double
          nullable: true
        name:
          type: string
          maxLength: 512
        channel_group_id:
          type: integer
        tvg_id:
          type: string
          nullable: true
          maxLength: 255
        tvc_guide_stationid:
          type: string
          nullable: true
          maxLength: 255
        epg_data_id:
          type: integer
          nullable: true
        streams:
          type: array
          items:
            type: integer
        stream_profile_id:
          type: integer
          nullable: true
        uuid:
          type: string
          format: uuid
          readOnly: true
        logo_id:
          type: integer
          nullable: true
        user_level:
          type: integer
          maximum: 2147483647
          minimum: -2147483648
        is_adult:
          type: boolean
          description: Whether this channel contains adult content
        is_catchup:
          type: boolean
          description: Whether any stream on this channel supports catch-up (tv_archive=1)
        catchup_days:
          type: integer
          maximum: 2147483647
          minimum: 0
          description: Max catch-up archive days across all streams on this channel
        hidden_from_output:
          type: boolean
          description: Exclude this channel from downstream client output (HDHR, M3U,
            EPG, XC). Auto-sync still updates provider metadata.
        auto_created:
          type: boolean
          description: Whether this channel was automatically created via M3U auto
            channel sync
        auto_created_by:
          type: integer
          nullable: true
          description: The M3U account that auto-created this channel
        auto_created_by_name:
          type: string
          readOnly: true
        override:
          allOf:
          - $ref: '#/components/schemas/ChannelOverride'
          nullable: true
          description: 'Per-field overrides for an auto-created channel. Send {"override":
            {"name": "ESPN"}} to upsert the listed fields, {"override": {"name": null}}
            to clear specific fields while leaving others, or {"override": null} to
            delete the override row entirely. Omitting the key leaves any existing
            override unchanged. Only valid for auto_created=True channels. Duplicate
            channel_number values across channels are permitted; downstream client
            behavior on duplicates varies by client.'
        source_stream:
          type: string
          readOnly: true
        effective_name:
          type: string
          readOnly: true
        effective_channel_number:
          type: string
          readOnly: true
        effective_channel_group_id:
          type: string
          readOnly: true
        effective_logo_id:
          type: string
          readOnly: true
        effective_tvg_id:
          type: string
          readOnly: true
        effective_tvc_guide_stationid:
          type: string
          readOnly: true
        effective_epg_data_id:
          type: string
          readOnly: true
        effective_stream_profile_id:
          type: string
          readOnly: true
      required:
      - auto_created_by_name
      - effective_channel_group_id
      - effective_channel_number
      - effective_epg_data_id
      - effective_logo_id
      - effective_name
      - effective_stream_profile_id
      - effective_tvc_guide_stationid
      - effective_tvg_id
      - id
      - name
      - source_stream
      - uuid
    ChannelBulkEditErrorResponse:
