  /proxy/catchup/{channel_id}:
    get:
      operationId: proxy_catchup_retrieve
      description: |-
        Stream catch-up (TV archive) MPEG-TS for a channel.

        **Recommended (native apps):** call ``POST /api/catchup/sessions/`` with a JWT or API key to obtain a ``playback_url`` containing ``session_id`` only. Pass that URL to the video player without an ``?token=`` required. The session binds the programme ``start`` time server-side.

        **Legacy / direct auth:** supply ``start`` (programme UTC start time) plus ``Authorization: Bearer``, ``X-API-Key``, or ``?token=<jwt>``. Optionally include a client ``session_id`` for provider pooling.

        **``session_id`` without a matching pool:** the server responds with **301** and a minted ``session_id`` (direct-auth / first play only).

        **``session_id`` omitted but pool match:** when the same viewer reconnects (e.g. IPTV fast-forward) and fingerprint-matches an existing pool entry, the stream is served on that request with no redirect round trip.

        **Plain GET (no ``Range``):** upstream archive is streamed from byte 0 with ``Content-Length`` when the provider reports file size (provider-faithful behaviour for XC-style IPTV clients).
      parameters:
      - in: path
        name: channel_id
        schema:
          type: string
          format: uuid
        required: true
      - in: query
        name: session_id
        schema:
          type: string
        description: Playback session from ``POST /api/catchup/sessions/`` or a prior
          **301** redirect. When present, JWT is optional. Reuse for all range/seek
          requests during the same programme. May be omitted on reconnect when the
          server adopts a fingerprint-matched pool entry.
      - in: query
        name: start
        schema:
          type: string
        description: Programme start time in UTC. Required for direct-auth playback
          (no API session). Ignored when ``session_id`` was issued by ``POST /api/catchup/sessions/``.
      - in: query
        name: token
        schema:
          type: string
        description: JWT access token when Authorization headers are unavailable.
          Not needed when using an API playback session.
      tags:
      - proxy
      security:
      - jwtAuth: []
      - ApiKeyAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                description: MPEG-TS stream. Partial content (``206``) when the client
                  sent ``Range``. Full-file ``200`` on plain GET includes ``Content-Length``
                  when the upstream archive size is known.
          description: ''
        '301':
          content:
            application/json:
              schema:
                description: Redirect to the same URL with a server-minted ``session_id``
                  when the client did not supply one and no fingerprint-matched pool
                  entry exists (first play / direct-auth only).
          description: ''
        '401':
          content:
            application/json:
              schema:
                description: Missing or expired authentication / session.
          description: ''
        '403':
          content:
            application/json:
              schema:
                description: Access denied or session/channel mismatch.
          description: ''
