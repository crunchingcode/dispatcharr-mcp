openapi: 3.0.3
info:
  title: Dispatcharr API
  version: 1.0.0
  description: API documentation for Dispatcharr
paths:
  /{username}/{password}/{channel_id}:
    get:
      operationId: root_retrieve
      parameters:
      - in: path
        name: channel_id
        schema:
          type: string
        required: true
      - in: path
        name: password
        schema:
          type: string
        required: true
      - in: path
        name: username
        schema:
          type: string
        required: true
      security:
      - jwtAuth: []
      - ApiKeyAuth: []
      - {}
      responses:
        '200':
          description: No response body
  /api/accounts/api-keys/:
    get:
      operationId: api_accounts_api_keys_retrieve
      tags:
      - api
      security:
      - jwtAuth: []
      - ApiKeyAuth: []
      responses:
        '200':
          description: No response body
  /api/accounts/api-keys/generate/:
    post:
      operationId: api_accounts_api_keys_generate_create
      tags:
      - api
      security:
      - jwtAuth: []
      - ApiKeyAuth: []
      responses:
        '200':
          description: No response body
  /api/accounts/api-keys/revoke/:
    post:
      operationId: api_accounts_api_keys_revoke_create
      tags:
      - api
      security:
      - jwtAuth: []
      - ApiKeyAuth: []
      responses:
        '200':
          description: No response body
  /api/accounts/auth/login/:
    post:
      operationId: api_accounts_auth_login_create
      description: Alias for POST /api/accounts/token/ — returns JWT access and refresh
        tokens.
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/LoginRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/LoginRequest'
        required: true
      security:
      - jwtAuth: []
      - ApiKeyAuth: []
      responses:
        '200':
          description: No response body
  /api/accounts/auth/logout/:
    post:
      operationId: api_accounts_auth_logout_create
      description: Log out the current user
      tags:
      - api
      security:
      - jwtAuth: []
      - ApiKeyAuth: []
      responses:
        '200':
          description: No response body
  /api/accounts/groups/:
    get:
      operationId: api_accounts_groups_list
      description: Retrieve a list of groups
      tags:
      - api
      security:
      - jwtAuth: []
      - ApiKeyAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Group'
          description: ''
    post:
      operationId: api_accounts_groups_create
      description: Create a new group
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Group'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Group'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Group'
        required: true
      security:
      - jwtAuth: []
      - ApiKeyAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Group'
          description: ''
  /api/accounts/groups/{id}/:
    get:
      operationId: api_accounts_groups_retrieve
      description: Retrieve a specific group by ID
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this group.
        required: true
      tags:
      - api
      security:
      - jwtAuth: []
      - ApiKeyAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Group'
          description: ''
    put:
      operationId: api_accounts_groups_update
      description: Update a group
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this group.
        required: true
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Group'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Group'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Group'
        required: true
      security:
      - jwtAuth: []
      - ApiKeyAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Group'
          description: ''
    patch:
      operationId: api_accounts_groups_partial_update
      description: |-
        CRUD for Django auth groups and their permissions.

        Dispatcharr authorization uses ``user_level``, not these groups. The
        endpoint is kept for compatibility but restricted to admins so
        non-admins cannot invent auth groups or attach Django permissions.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this group.
        required: true
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedGroup'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedGroup'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedGroup'
      security:
      - jwtAuth: []
      - ApiKeyAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Group'
          description: ''
    delete:
      operationId: api_accounts_groups_destroy
      description: Delete a group
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this group.
        required: true
      tags:
      - api
      security:
      - jwtAuth: []
      - ApiKeyAuth: []
      responses:
        '204':
          description: No response body
  /api/accounts/permissions/:
    get:
      operationId: api_accounts_permissions_list
      description: Retrieve a list of all permissions
      tags:
      - api
      security:
      - jwtAuth: []
      - ApiKeyAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Permission'
          description: ''
  /api/accounts/token/:
    post:
      operationId: api_accounts_token_create
      description: |-
        Takes a set of user credentials and returns an access and refresh JSON web
        token pair to prove the authentication of those credentials.
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenObtainPair'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenObtainPair'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenObtainPair'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenObtainPair'
          description: ''
  /api/accounts/token/refresh/:
    post:
      operationId: api_accounts_token_refresh_create
      description: |-
        Takes a refresh type JSON web token and returns an access type JSON web
        token if the refresh token is valid.
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRefresh'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenRefresh'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenRefresh'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenRefresh'
          description: ''
  /api/accounts/users/:
    get:
      operationId: api_accounts_users_list
      description: Retrieve a list of users
      tags:
      - api
      security:
      - jwtAuth: []
      - ApiKeyAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/User'
          description: ''
    post:
      operationId: api_accounts_users_create
      description: Create a new user
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/User'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/User'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/User'
        required: true
      security:
      - jwtAuth: []
      - ApiKeyAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
  /api/accounts/users/{id}/:
    get:
      operationId: api_accounts_users_retrieve
      description: Retrieve a specific user by ID
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this user.
        required: true
      tags:
      - api
      security:
      - jwtAuth: []
      - ApiKeyAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
    put:
      operationId: api_accounts_users_update
      description: Update a user
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this user.
        required: true
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/User'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/User'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/User'
        required: true
      security:
      - jwtAuth: []
      - ApiKeyAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
    patch:
      operationId: api_accounts_users_partial_update
      description: Handles CRUD operations for Users
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this user.
        required: true
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedUser'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedUser'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedUser'
      security:
      - jwtAuth: []
      - ApiKeyAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
    delete:
      operationId: api_accounts_users_destroy
      description: Delete a user
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this user.
        required: true
      tags:
      - api
      security:
      - jwtAuth: []
      - ApiKeyAuth: []
      responses:
        '204':
          description: No response body
  /api/accounts/users/me/:
    get:
      operationId: api_accounts_users_me_retrieve
      description: Get or update active user information. PATCH updates custom_properties
        with merge semantics.
      tags:
      - api
      security:
      - jwtAuth: []
      - ApiKeyAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
    patch:
      operationId: api_accounts_users_me_partial_update
      description: Get or update active user information. PATCH updates custom_properties
        with merge semantics.
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedUser'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedUser'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedUser'
      security:
      - jwtAuth: []
      - ApiKeyAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
  /api/backups/:
    get:
      operationId: api_backups_retrieve
      description: List all available backup files.
      tags:
      - api
      security:
      - jwtAuth: []
      - ApiKeyAuth: []
      responses:
        '200':
          description: No response body
  /api/backups/{filename}/delete/:
    delete:
      operationId: api_backups_delete_destroy
      description: Delete a backup file.
      parameters:
      - in: path
        name: filename
        schema:
          type: string
        required: true
      tags:
      - api
      security:
      - jwtAuth: []
      - ApiKeyAuth: []
      responses:
        '204':
          description: No response body
  /api/backups/{filename}/download/:
    get:
      operationId: api_backups_download_retrieve
      description: |-
        Download a backup file.

        Requires either:
        - Valid admin authentication, OR
        - Valid download_token query parameter
      parameters:
      - in: path
        name: filename
        schema:
          type: string
        required: true
      tags:
      - api
      security:
      - jwtAuth: []
      - ApiKeyAuth: []
      - {}
      responses:
        '200':
          description: No response body
  /api/backups/{filename}/download-token/:
    get:
      operationId: api_backups_download_token_retrieve
      description: Get a signed token for downloading a backup file.
      parameters:
      - in: path
        name: filename
        schema:
          type: string
        required: true
      tags:
      - api
      security:
      - jwtAuth: []
      - ApiKeyAuth: []
      responses:
        '200':
          description: No response body
  /api/backups/{filename}/restore/:
    post:
      operationId: api_backups_restore_create
      description: 'Restore from a backup file (async via Celery). WARNING: This will
        flush the database!'
      parameters:
      - in: path
        name: filename
        schema:
          type: string
        required: true
      tags:
      - api
      security:
      - jwtAuth: []
      - ApiKeyAuth: []
      responses:
        '200':
          description: No response body
  /api/backups/create/:
    post:
      operationId: api_backups_create_create
      description: Create a new backup (async via Celery).
      tags:
      - api
      security:
      - jwtAuth: []
      - ApiKeyAuth: []
      responses:
        '200':
          description: No response body
  /api/backups/schedule/:
    get:
      operationId: api_backups_schedule_retrieve
      description: Get backup schedule settings.
      tags:
      - api
      security:
      - jwtAuth: []
      - ApiKeyAuth: []
      responses:
        '200':
          description: No response body
  /api/backups/schedule/update/:
    put:
      operationId: api_backups_schedule_update_update
      description: Update backup schedule settings.
      tags:
      - api
      security:
      - jwtAuth: []
      - ApiKeyAuth: []
      responses:
        '200':
          description: No response body
  /api/backups/status/{task_id}/:
    get:
      operationId: api_backups_status_retrieve
      description: |-
        Check the status of a backup/restore task.

        Requires either:
        - Valid admin authentication, OR
        - Valid task_token query parameter
      parameters:
      - in: path
        name: task_id
        schema:
          type: string
        required: true
      tags:
      - api
      security:
      - jwtAuth: []
      - ApiKeyAuth: []
      - {}
      responses:
        '200':
          description: No response body
  /api/backups/upload/:
    post:
      operationId: api_backups_upload_create
      description: Upload a backup file for restoration.
      tags:
      - api
      security:
      - jwtAuth: []
      - ApiKeyAuth: []
      responses:
        '200':
          description: No response body
  /api/catchup/sessions/:
    post:
      operationId: api_catchup_sessions_create
      description: |-
        Create a catch-up playback session for a single archived programme.

        Call this once per programme with a JWT or API key. The response includes a ``playback_url`` for the video player **without** an embedded access token.

        **``start``** is the programme's broadcast start time in UTC (from EPG ``start_time``). It selects *which* archived show to fetch, not when the viewer pressed play.

        **``duration``** is optional programme length in minutes. Native clients should send it when their guide knows the programme length. Dispatcharr uses it before local EPG duration, adds a short provider-lag buffer, and falls back to EPG duration, then the default archive window when omitted.

        The player should open ``playback_url`` within **60 seconds** (see ``expires_at``). After the first byte request, the session stays valid with a **10-minute sliding idle window** (refreshed on each range/seek request).

        Start a **new** session for each different programme.
      tags:
      - catchup
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CatchupSessionCreate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CatchupSessionCreate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CatchupSessionCreate'
        required: true
      security:
      - jwtAuth: []
      - ApiKeyAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatchupSessionResponse'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatchupSessionCreateError'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatchupSessionForbidden'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatchupSessionNotFound'
          description: ''
  /api/catchup/sessions/{session_id}/:
    delete:
      operationId: api_catchup_sessions_destroy
      description: Delete a catch-up session before it expires. Only the user who
        created the session may revoke it. Returns 404 when the session is missing
        or owned by another user.
      parameters:
      - in: path
        name: session_id
        schema:
          type: string
        required: true
      tags:
      - catchup
      security:
      - jwtAuth: []
      - ApiKeyAuth: []
      responses:
        '204':
          description: No response body
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatchupSessionDestroyForbidden'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatchupSessionDestroyNotFound'
          description: ''
  /api/catchup/sessions/{session_id}/position/:
    post:
      operationId: api_catchup_sessions_position_create
      description: |-
        Update the reported playhead for an active catch-up session.

        Native apps can call this while paused or after local scrubbing so admin stats stay aligned with what the viewer sees. This does **not** seek the provider stream; HTTP ``Range`` / a new archive open still control bytes.

        Requires an active playback connection for ``session_id``. Also refreshes the session idle TTL.
      parameters:
      - in: path
        name: session_id
        schema:
          type: string
        required: true
      tags:
      - catchup
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CatchupSessionPosition'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CatchupSessionPosition'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CatchupSessionPosition'
        required: true
      security:
      - jwtAuth: []
      - ApiKeyAuth: []
      responses:
        '204':
          description: No response body
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatchupSessionPositionError'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatchupSessionPositionForbidden'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatchupSessionPositionNotFound'
          description: ''
  /api/channels/channels/:
    get:
      operationId: api_channels_channels_list
      parameters:
      - in: query
        name: channel_group
        schema:
          type: string
      - in: query
        name: epg
        schema:
          type: string
      - in: query
        name: name
        schema:
          type: string
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      tags:
      - api
      security:
      - jwtAuth: []
      - ApiKeyAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedChannelList'
          description: ''
    post:
      operationId: api_channels_channels_create
      description: Override create to handle channel profile membership
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Channel'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Channel'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Channel'
        required: true
      security:
      - jwtAuth: []
      - ApiKeyAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Channel'
          description: ''
  /api/channels/channels/{channel_id}/streams/:
    get:
      operationId: api_channels_channels_streams_retrieve
      parameters:
      - in: path
        name: channel_id
        schema:
          type: integer
        required: true
      tags:
      - api
      security:
      - jwtAuth: []
      - ApiKeyAuth: []
      responses:
        '200':
          description: No response body
  /api/channels/channels/{channel_id}/streams/stats/:
    get:
      operationId: api_channels_channels_streams_stats_list
      description: Return a minimal stats delta for the streams attached to a channel.
        Used by the channel table to refresh `stream_stats` on row expand and after
        a preview closes without re-pulling full stream rows.
      parameters:
      - in: path
        name: channel_id
        schema:
          type: integer
        required: true
      - in: query
        name: ids
        schema:
          type: string
        description: Comma-separated stream IDs to restrict the response to. Combined
          with `since` via AND.
      - in: query
        name: since
        schema:
          type: string
          format: date-time
        description: ISO 8601 timestamp. Returns only streams whose `stream_stats_updated_at`
          is strictly newer than this value. Omit to return all streams for the channel.
      tags:
      - api
      security:
      - jwtAuth: []
      - ApiKeyAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ChannelStreamStatsDelta'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChannelStreamStatsErrorResponse'
          description: ''
  /api/channels/channels/{id}/:
    get:
      operationId: api_channels_channels_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this channel.
        required: true
      tags:
      - api
      security:
      - jwtAuth: []
      - ApiKeyAuth: []
      responses:
        '200':
          content:
