  /api/m3u/accounts/{id}/repack-group/:
    post:
      operationId: api_m3u_accounts_repack_group_create
      description: |-
        Manually re-pack visible channels in one of this account's
        groups into the group's [start, end] range. Override-pinned
        numbers are treated as reservations and skipped. Hidden channels
        without overrides have their channel_number set to NULL.

        Useful when the user has just finished customizing channels
        (setting overrides as pins, hiding unwanted streams) and wants
        the result reflected immediately rather than on the next M3U
        refresh. Also acts as a one-shot cleanup for groups that aren't
        running in compact mode but have accumulated gaps.
      parameters:
      - in: query
        name: channel_group_id
        schema:
          type: integer
        description: ID of the ChannelGroup whose auto-created channels should be
          repacked.
        required: true
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this m3u account.
        required: true
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/M3UAccount'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/M3UAccount'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/M3UAccount'
        required: true
      security:
      - jwtAuth: []
      - ApiKeyAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  assigned:
                    type: integer
                  released:
                    type: integer
                  failed:
                    type: integer
          description: ''
